[package]
name = "ttrpg-scheduling"
version = "0.1.0"
edition = "2024"

[dependencies]
ammonia = "4.2.4"
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12", features = ["cookie", "form"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
deunicode = "1.6.2"
dotenvy = "0.15.7"
minijinja = { version = "3.0.0", features = ["serde", "json"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
rand = "0.10"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.dev.package.argon2]
opt-level = 3

# Release builds for the Pi: smaller and a bit faster binary, at the cost of build time.
[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["cookies", "form"] }
scraper = "0.29.0"
serde_json = "1.0.154"
thirtyfour = { version = "0.38.1", default-features = false, features = ["reqwest"] }
